openapi: 3.1.2
info:
  title: PadosiPro API
  version: 1.0.0
  description: API for the PadosiPro onboarding assignment.
servers:
  - url: http://localhost:4000
paths:
  /health/live:
    get:
      summary: Liveness check
      responses:
        '200':
          description: Server is running.
  /health/ready:
    get:
      summary: Readiness check
      responses:
        '200':
          description: Server and database are ready.
        '503':
          description: Dependency not ready.
  /api/v1/auth/register:
    post:
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created. The response reports whether the verification email was sent.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [userId, email, verificationRequired, verificationEmailSent]
                    properties:
                      userId: { type: integer }
                      email: { type: string, format: email }
                      verificationRequired: { type: boolean, const: true }
                      verificationEmailSent: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/verify-email:
    post:
      summary: Verify email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyRequest' }
      responses:
        '200': { description: Email verified. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/resend-verification:
    post:
      summary: Resend OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: OTP sent. }
        '404': { description: Email not found. }
        '502':
          description: Mailjet rejected the verification email or the send request failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '200':
          description: Short-lived access token, rotating refresh token, and current session state returned.
        '401': { description: Invalid credentials. }
        '403': { description: Email not verified. }
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 32, maxLength: 200 }
      responses:
        '200': { description: New access and refresh tokens returned; the supplied refresh token is invalidated. }
        '401': { description: Refresh token is invalid, expired, revoked, or reused. }
  /api/v1/auth/logout:
    post:
      summary: Revoke the refresh-token session family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 32, maxLength: 200 }
      responses:
        '200': { description: Refresh-token session revoked. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/profile:
    get:
      summary: Get current user profile and selected tasks
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user state. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Save profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileRequest' }
      responses:
        '200': { description: Profile saved. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/tasks:
    get:
      summary: List task catalogue
      parameters:
        - { in: query, name: search, schema: { type: string, maxLength: 60 } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Paginated tasks. }
  /api/v1/tasks/selected:
    get:
      summary: Get selected tasks
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Selected tasks. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Save selected tasks
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskIds]
              properties:
                taskIds:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { type: integer, minimum: 1 }
      responses:
        '200': { description: Selection saved. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, confirmPassword]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        confirmPassword: { type: string, minLength: 8, maxLength: 72 }
    VerifyRequest:
      type: object
      required: [email, otp]
      properties:
        email: { type: string, format: email }
        otp: { type: string, pattern: '^[0-9]{6}$' }
    ProfileRequest:
      type: object
      required: [name, mobile, address]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        mobile: { type: string, pattern: '^\+91[0-9]{10}$' }
        address: { type: string, minLength: 5, maxLength: 300 }
        businessName: { type: string, maxLength: 120 }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
