openapi: 3.1.2
info:
  title: PadosiPro API
  version: 1.0.0
  description: API for the PadosiPro onboarding assignment.
servers:
  - url: http://localhost:4000
paths:
  /health/live:
    get:
      summary: Liveness check
      responses:
        '200':
          description: Server is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /health/ready:
    get:
      summary: Readiness check
      responses:
        '200':
          description: Server and database are ready.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        '503':
          description: Dependency not ready.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: not_ready }
  /api/v1/auth/register:
    post:
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Pending registration created. The response reports whether the verification email was sent.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [registrationId, email, verificationRequired, verificationEmailSent]
                    properties:
                      registrationId: { type: string, format: uuid }
                      email: { type: string, format: email }
                      verificationRequired: { type: boolean, const: true }
                      verificationEmailSent: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/verify-email:
    post:
      summary: Verify email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyRequest' }
      responses:
        '200':
          description: Email verified. Returns tokens and current session state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/resend-verification:
    post:
      summary: Resend OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registrationId]
              properties:
                registrationId: { type: string, format: uuid }
      responses:
        '200':
          description: Verification code sent for this pending registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResendResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502':
          description: Mailjet rejected the verification email or the send request failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '200':
          description: Tokens and current session state. Date fields are ISO 8601 strings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 32, maxLength: 200 }
                refreshAttemptId: { type: string, minLength: 16, maxLength: 100, pattern: '^[a-zA-Z0-9_-]+$' }
      responses:
        '200':
          description: New access and refresh tokens returned; the supplied refresh token is invalidated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/logout:
    post:
      summary: Revoke the refresh-token session family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 32, maxLength: 200 }
      responses:
        '200':
          description: Refresh-token session revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/profile:
    get:
      summary: Get current user profile and selected tasks
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user state. Date fields are ISO 8601 strings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      summary: Save profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileRequest' }
      responses:
        '200':
          description: Profile saved. `updated_at` is an ISO 8601 string.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/tasks:
    get:
      summary: List task catalogue
      parameters:
        - { in: query, name: search, schema: { type: string, maxLength: 60 } }
        - { in: query, name: category, schema: { type: string, enum: ['Errands & Daily Tasks', 'Home Services', 'Travel & Tourism', 'Health & Medical', 'Senior Care', 'Events & Management'] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 1000, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Paginated tasks. Pagination is a sibling of `data`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/tasks/selected:
    get:
      summary: Get selected tasks
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Selected tasks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskArrayResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      summary: Save selected tasks
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskIds]
              properties:
                taskIds:
                  type: array
                  minItems: 1
                  maxItems: 30
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Saved task selection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskArrayResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, confirmPassword]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        confirmPassword: { type: string, minLength: 8, maxLength: 72 }
    VerifyRequest:
      type: object
      required: [registrationId, otp]
      properties:
        registrationId: { type: string, format: uuid }
        otp: { type: string, pattern: '^[0-9]{6}$' }
    ProfileRequest:
      type: object
      required: [name, mobile, address]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        mobile: { type: string, pattern: '^\+91[0-9]{10}$' }
        address: { type: string, minLength: 5, maxLength: 300 }
        businessName: { type: string, maxLength: 120 }
    ResendResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [sent]
          properties:
            sent: { type: boolean, const: true }
    TokenResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accessToken, refreshToken]
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
    LogoutResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [loggedOut]
          properties:
            loggedOut: { type: boolean, const: true }
    Task:
      type: object
      required: [id, name, category, description]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        description: { type: string }
    Pagination:
      type: object
      required: [page, limit, total, pages]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        pages: { type: integer, minimum: 0 }
    TaskListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    TaskArrayResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Task' }
    UserSummary:
      type: object
      required: [id, email, emailVerifiedAt]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        emailVerifiedAt: { type: string, format: date-time }
    Profile:
      type: object
      required: [name, mobile, address, businessName, updated_at]
      properties:
        name: { type: string }
        mobile: { type: string }
        address: { type: string }
        businessName: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }
    SessionData:
      type: object
      required: [user, profile, selectedTasks, setupComplete]
      properties:
        user: { $ref: '#/components/schemas/UserSummary' }
        profile:
          oneOf:
            - { $ref: '#/components/schemas/Profile' }
            - { type: 'null' }
        selectedTasks:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        setupComplete: { type: boolean }
    SessionResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/SessionData' }
    ProfileResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Profile' }
    LoginResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - { $ref: '#/components/schemas/SessionData' }
            - type: object
              required: [accessToken, refreshToken]
              properties:
                accessToken: { type: string }
                refreshToken: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: {}
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Operation is not permitted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
